# 自选股清单示例：把这里的内容合并进 config.yaml 的 watchlist
#
# 支持三种写法，都会归一化成 600519.SH：
#   600519
#   sh600519
#   600519.SH
#
# 注意：YAML 会把 000001 解析成整数并丢掉前导零，务必加引号

watchlist:
  # 沪市主板
  - "600519"        # 贵州茅台
  - "601318"        # 中国平安
  - "600036"        # 招商银行
  # 深市主板 / 中小板
  - "000001"        # 平安银行
  - "000858"        # 五粮液
  - "002415"        # 海康威视
  # 创业板
  - "300750"        # 宁德时代
  - "300059"        # 东方财富
  # 科创板
  - "688981"        # 中芯国际
  - "688111"        # 金山办公
