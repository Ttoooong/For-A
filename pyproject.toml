[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "for-a"
version = "0.1.0"
description = "A 股信息监控平台 —— 多源行情、公告与舆情采集，规则引擎驱动告警"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
tdx = ["pytdx>=1.72"]
dev = ["pytest>=7.4"]

[project.scripts]
for-a = "for_a.cli:main"

[tool.setuptools.packages.find]
include = ["for_a*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
